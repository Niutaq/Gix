# Legacy DigitalOcean deploy. Credits are unavailable — disabled as a default push trigger.
# Re-enable only if DO access returns; day-to-day FinOps uses local k3d/OpenCost instead.
name: Build and Deploy Backend (legacy DO)

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_do:
        description: "Type 'deploy-do' to confirm legacy DigitalOcean deploy"
        required: true
        type: string

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy DigitalOcean deploy
        if: ${{ inputs.confirm_legacy_do != 'deploy-do' }}
        run: |
          echo "Refusing deploy. This workflow is legacy (DigitalOcean)."
          echo "Use local FinOps: task finops:bootstrap"
          exit 1

  build-and-push:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            niutaq/gix-backend:${{ github.sha }}
            niutaq/gix-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save gix-pool-cluster

      - name: Apply Infrastructure and Policies
        run: |
          kubectl apply -f k8s/02-db.yaml
          kubectl apply -f k8s/03-redis.yaml
          kubectl apply -f k8s/08-policies.yaml
          kubectl rollout restart deployment gix-redis

      - name: Update Kubernetes Deployment
        run: |
          kubectl apply -f k8s/04-backend.yaml
          kubectl set image deployment/gix-backend gix-backend=niutaq/gix-backend:${{ github.sha }}
          kubectl rollout restart deployment/gix-backend
          kubectl rollout status deployment/gix-backend
