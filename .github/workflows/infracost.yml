name: Infracost

on:
  pull_request:
    paths:
      - 'terraform/**'

jobs:
  infracost:
    name: Infracost Estimate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Skip when API key is missing
        id: gate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [[ -z "${INFRACOST_API_KEY}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "INFRACOST_API_KEY is not set — skipping cost estimate (optional for FOSS/local path)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Infracost
        if: steps.gate.outputs.skip != 'true'
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Checkout PR branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Generate Infracost cost estimate baseline
        if: steps.gate.outputs.skip != 'true'
        run: |
          infracost breakdown --path=terraform \
                              --format=json \
                              --out-file=/tmp/infracost-base.json

      - name: Post Infracost comment
        if: steps.gate.outputs.skip != 'true'
        run: |
          infracost comment github --path=/tmp/infracost-base.json \
                                   --repo=$GITHUB_REPOSITORY \
                                   --pull-request=${{github.event.pull_request.number}} \
                                   --github-token=${{github.token}} \
                                   --behavior=update
