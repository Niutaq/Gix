# Grafana for FinOps cost-flow dashboards (FOSS alternative to DataDog).
# Timescale credentials must match docker-compose /.env (gix_rates).
adminUser: admin
adminPassword: gix-finops-local

persistence:
  enabled: false

service:
  type: NodePort
  nodePort: 30300

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.finops.svc.cluster.local
        access: proxy
        isDefault: true
      - name: TimescaleDB
        type: postgres
        uid: timescale
        url: host.k3d.internal:5433
        # Must match docker-compose POSTGRES_* / .env.example
        database: gix_rates
        user: gixuser
        secureJsonData:
          password: change-me-local-only
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: true
      - name: Loki
        type: loki
        uid: loki
        url: http://host.k3d.internal:3100
        access: proxy
        jsonData:
          maxLines: 1000

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: gix-finops
        orgId: 1
        folder: FinOps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/gix-finops

dashboardsConfigMaps:
  gix-finops: gix-finops-dashboards

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
