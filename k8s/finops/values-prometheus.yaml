# Lightweight Prometheus for local FinOps (k3d) — FOSS, no cloud bill.
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

server:
  persistentVolume:
    enabled: false
  retention: "7d"
  global:
    scrape_interval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
