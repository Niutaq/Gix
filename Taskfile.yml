version: "3"

# Xcode license / broken git → `go build` fails with "error obtaining VCS status: exit status 69".
env:
  GOFLAGS: "-buildvcs=false"

tasks:
  default:
    desc: "Default task (lint and proto)"
    cmds:
      - task: lint
      - task: proto

  proto:
    desc: "Generates Go code from Protobuf files"
    cmds:
      - protoc --go_out=. --go-drpc_out=. api/proto/v1/rates.proto

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  test:
    desc: "Run unit tests"
    cmds:
      - go test -race -v ./...

  vuln:
    desc: "Run govulncheck on Go code"
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  run:backend:
    desc: "Run Gix API / harvester locally (bin/Gix-API — not FinOps-branded)"
    dotenv: ['.env']
    env:
      REDIS_URL: "redis://localhost:6379/0"
      NATS_URL: "nats://localhost:4222"
      DD_TRACE_ENABLED: "false"
    cmds:
      - mkdir -p logs bin
      - go build -buildvcs=false -o bin/Gix-API ./cmd/gix-server
      - DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5433/$POSTGRES_DB?sslmode=disable" ./bin/Gix-API 2>&1 | tee -a logs/backend.log

  run:estimator:
    desc: "Run cost estimator locally"
    dotenv: ['.env']
    env:
      NATS_URL: "nats://localhost:4222"
      DD_TRACE_ENABLED: "false"
    cmds:
      - mkdir -p logs
      - DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5433/${POSTGRES_DB}?sslmode=disable" go run ./cmd/cost-estimator 2>&1 | tee -a logs/finops.log

  start:gui:local:
    desc: "Start GUI pointing to local API"
    dotenv: ['.env']
    cmds:
      - mkdir -p logs bin
      # Build as Gix (not "main") so Dock / Activity Monitor show the right name.
      - go build -buildvcs=false -o bin/Gix ./cmd/gix
      - ./bin/Gix -api "http://localhost:8080" 2>&1 | tee -a logs/frontend.log

  start:gui:remote:
    desc: "(legacy) Start GUI pointing to the old DigitalOcean API endpoint"
    cmds:
      - mkdir -p bin
      - go build -buildvcs=false -o bin/Gix ./cmd/gix
      - ./bin/Gix -api "http://165.227.246.100:8080"

  deploy:do:
    desc: "(legacy) Build, push and deploy backend to DigitalOcean K8s — credits unavailable; prefer local FinOps"
    cmds:
      - 'echo "WARNING: DigitalOcean deploy is legacy. Prefer task finops:bootstrap + docker compose."'
      - docker buildx build --platform linux/amd64 -t niutaq/gix-backend:latest --push .
      - helm upgrade --install gix-backend charts/gix -f charts/gix/values.yaml

  llm:up:
    desc: "Start offline Ollama (no cloud API key)"
    cmds:
      - docker compose up -d ollama

  llm:pull:
    desc: "Pull the configured Ollama model (default llama3.2)"
    dotenv: ['.env']
    cmds:
      - |
        MODEL="${OLLAMA_MODEL:-llama3.2}"
        echo "Pulling Ollama model: ${MODEL}"
        docker exec gix-ollama ollama pull "${MODEL}"

  up:
    desc: "Alias for finops:up — full local Gix stack (API + observability), product-branded"
    cmds:
      - task: finops:up

  finops:up:
    desc: "One terminal: Compose + k3d (ns gix) + port-forwards + Gix-API + estimator + sync (verbose)"
    dotenv: ['.env']
    cmds:
      - bash scripts/finops-stack.sh up

  finops:down:
    desc: "Stop background procs started by finops:up (backend, estimator, port-forwards)"
    cmds:
      - bash scripts/finops-stack.sh down

  finops:status:
    desc: "Show which FinOps-related ports / PIDs are up"
    cmds:
      - bash scripts/finops-stack.sh status

  finops:bootstrap:
    desc: "Bootstrap local CNCF FinOps stack only (k3d + Prometheus + OpenCost + Grafana)"
    cmds:
      - bash scripts/bootstrap-local-finops.sh

  finops:sync:
    desc: "Sync OpenCost allocation (+ app unit costs) into FOCUS tables"
    dotenv: ['.env']
    cmds:
      - bash scripts/sync-opencost-focus.sh

  finops:flow:
    desc: "Print local FinOps cost-flow JSON from the API"
    cmds:
      - curl -sf "http://127.0.0.1:8080/api/v1/finops/flow" | (command -v jq >/dev/null && jq . || cat)

  obs:up:
    desc: "Start Loki + Promtail (FOSS log stack); Grafana Explore → Loki"
    cmds:
      - mkdir -p logs
      - touch logs/backend.log logs/frontend.log logs/finops.log
      - docker compose -f docker-compose-obs.yml up -d
      - |
        echo "Loki:     http://127.0.0.1:3100"
        echo "Grafana:  http://127.0.0.1:3000 after task finops:up (or task obs:ui)"
        echo "Explore → Loki → {job=~\"gix-.*\"} or {container=~\"gix-.*\"}"

  obs:down:
    desc: "Stop Loki + Promtail"
    cmds:
      - docker compose -f docker-compose-obs.yml down

  obs:ui:
    desc: "Port-forward FinOps Grafana only (prefer task finops:up which does this in background)"
    cmds:
      - |
        echo "Grafana → http://127.0.0.1:3000  (admin / gix-finops-local)"
        echo "Tip: task finops:up keeps this forward in the background."
        echo "NodePort also: http://127.0.0.1:30300"
        kubectl -n "${GIX_NS:-gix}" port-forward svc/grafana 3000:80

  obs:grafana-sync:
    desc: "Re-apply Grafana + FinOps dashboard; Timescale password from .env"
    dotenv: ['.env']
    cmds:
      - bash scripts/apply-grafana-finops.sh

  docker:build:
    desc: "Build docker image"
    cmds:
      - docker buildx build --platform linux/amd64 -t niutaq/gix-backend:latest .

  k8s:deploy:
    desc: "Deploy backend to Kubernetes"
    cmds:
      - kubectl apply -f k8s/04-backend.yaml
      - kubectl rollout restart deployment gix-backend

  clean:
    desc: "Clean temporary and build files"
    cmds:
      - rm -rf Gix.app gix-bin trace.out

  build:macos:
    desc: "Builds a valid .app package for macOS"
    cmds:
      - rm -rf Gix.app
      - mkdir -p Gix.app/Contents/MacOS Gix.app/Contents/Resources
      - go build -buildvcs=false -o Gix.app/Contents/MacOS/Gix ./cmd/gix
      - |
        ICON_SRC="pkg/utilities/res/appicon.png"
        if [ -f appicon.png ]; then ICON_SRC="appicon.png"; fi
        cp "$ICON_SRC" Gix.app/Contents/Resources/icon.png
      - |
        cat <<EOF > Gix.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Gix</string>
            <key>CFBundleIconFile</key>
            <string>icon.png</string>
            <key>CFBundleIdentifier</key>
            <string>com.niutaq.gix</string>
            <key>CFBundleName</key>
            <string>Gix</string>
            <key>CFBundleDisplayName</key>
            <string>Gix</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>Gix needs your location to find the nearest currency exchange offices.</string>
        </dict>
        </plist>
        EOF
      - chmod +x Gix.app/Contents/MacOS/Gix
      - xattr -cr Gix.app
      - codesign --force --deep --sign - Gix.app

  helm:lint:
    desc: "Lint Helm chart (using Docker if helm is missing)"
    cmds:
      - |
        if command -v helm &> /dev/null; then
          helm lint charts/gix
        else
          echo "Helm not found locally, using Docker..."
          docker run --rm -v $(pwd):/apps -w /apps alpine/helm lint charts/gix
        fi

  trivy:scan:
    desc: "Scan project for vulnerabilities using Trivy (using Docker if trivy is missing)"
    cmds:
      - |
        if command -v trivy &> /dev/null; then
          trivy fs --severity CRITICAL,HIGH .
        else
          echo "Trivy not found locally, using Docker..."
          docker run --rm -v $(pwd):/root/.cache/ -v $(pwd):/project aquasec/trivy fs --severity CRITICAL,HIGH /project
        fi
